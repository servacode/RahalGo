packages:
  - "apps/*"
  - "packages/*"

# ══════════════════════════════════════════════════════════════════════
# **إلزامُ نسخٍ مُصلَحةٍ لاعتماديّاتٍ لا نطلبها نحن**
# ══════════════════════════════════════════════════════════════════════
#
# (فحصُ المشروع ٢٠٢٦-٠٨-٠٧، وأُغلقت بقرار المالك ٢٠٢٦-٠٨-٠٨: «نعم أكمل».)
#
# خمسُ ثغراتٍ كلُّها موروثةٌ عبر Next — **لا حزمةَ منها في `package.json`
# عندنا.**
#
# # ولماذا الإلزامُ لا الترقية
#
# قِيس: **`next@15.5.23` ما زال يثبّت `postcss 8.4.31` و`sharp ^0.34.3`**
# — فالثغراتُ تبقى في أحدث ١٥. **و`next@16.3` يحملهما مُصلَحين** —
# **وهي قفزةٌ كبرى تُقرَّر وحدَها**، لا تُدسّ في دفعةِ أمان.
#
# **والإلزامُ يُغلقها اليوم على ١٥**: `postcss` من ٨٫٤ إلى ٨٫٥ ترقيةٌ صغرى،
# و`sharp` من ٠٫٣٤ إلى ٠٫٣٥ كذلك — **ويُقاس أثرُهما ببناء التطبيقات الخمسة
# لا بالظنّ.**
#
# # وموضعُه هنا لا في package.json
#
# **pnpm ١٠٫٣٣ لم يعد يقرأ حقلَ `pnpm` في `package.json`** — يقوله في
# تحذيرٍ يمرّ في وسط سيل التثبيت: «The "pnpm" field is no longer read».
# **فالإلزامُ يُكتب ويُهمَل صامتاً**، ويُظنّ العطبُ مُغلقاً وهو مفتوح.
# ══════════════════════════════════════════════════════════════════════
overrides:
  # قراءةُ ملفٍّ عشوائيّةٌ وعبورُ مسارٍ في خرائط المصدر.
  postcss: ">=8.5.23"
  # ثغراتٌ موروثةٌ في libvips — ومُحسِّنُ الصور يعالج ما يُرفَع.
  sharp: ">=0.35.3"
  # مولّدٌ مخصّصٌ يدور بلا نهاية — يصل عبر `@tailwindcss/postcss`.
  nanoid: ">=3.3.17"
