<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5A6E"/>
      <stop offset="1" stop-color="#D81B3C"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C2183A"/>
      <stop offset="1" stop-color="#8E0F2A"/>
    </linearGradient>
    <linearGradient id="lidTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A98"/>
      <stop offset="1" stop-color="#F23B57"/>
    </linearGradient>
    <linearGradient id="lidFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6B7D"/>
      <stop offset="1" stop-color="#E02647"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE38A"/>
      <stop offset="0.5" stop-color="#FFC531"/>
      <stop offset="1" stop-color="#E49A00"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE38A"/>
      <stop offset="1" stop-color="#D98C00"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- ظلٌّ تحت العلبة -->
  <ellipse cx="128" cy="230" rx="92" ry="14" fill="url(#shadow)"/>
  <!-- الجسم: الوجه الأمامي والجانبي -->
  <path d="M40 120 L150 132 L150 222 L40 208 Z" fill="url(#front)"/>
  <path d="M150 132 L216 116 L216 204 L150 222 Z" fill="url(#side)"/>
  <!-- الشريط العمودي على الوجهين -->
  <path d="M86 125 L104 127 L104 216 L86 214 Z" fill="url(#goldV)"/>
  <path d="M176 126 L190 123 L190 210 L176 214 Z" fill="#C98200"/>
  <!-- الغطاء: الوجه العلوي والأمامي والجانبي -->
  <path d="M30 96 L150 108 L226 90 L108 80 Z" fill="url(#lidTop)"/>
  <path d="M30 96 L150 108 L150 134 L30 121 Z" fill="url(#lidFront)"/>
  <path d="M150 108 L226 90 L226 114 L150 134 Z" fill="url(#side)"/>
  <!-- الشريط على الغطاء -->
  <path d="M84 91 L104 93 L180 85 L162 83 Z" fill="url(#gold)"/>
  <path d="M84 91 L104 93 L104 129 L84 127 Z" fill="url(#goldV)"/>
  <path d="M174 86 L190 83 L190 110 L174 114 Z" fill="#C98200"/>
  <!-- العقدة -->
  <path d="M128 86 C96 50 64 58 74 76 C82 90 110 90 128 86 Z" fill="url(#gold)" stroke="#C98200" stroke-width="3"/>
  <path d="M128 86 C150 44 196 52 186 72 C178 88 150 90 128 86 Z" fill="url(#gold)" stroke="#C98200" stroke-width="3"/>
  <ellipse cx="128" cy="85" rx="13" ry="9" fill="#FFB300" stroke="#C98200" stroke-width="3"/>
  <!-- لمعة -->
  <path d="M46 126 L62 128 L62 200 L46 198 Z" fill="url(#shine)"/>
  <path d="M40 98 L120 106 L118 112 L38 104 Z" fill="#fff" fill-opacity="0.35"/>
