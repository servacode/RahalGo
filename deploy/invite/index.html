<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دعوة إلى رحّال غو</title>
<meta name="description" content="صديقك دعاك إلى رحّال غو — احجز هديتك وحمّل التطبيق">
<!--
  ══════════════════════════════════════════════════════════════════════
  **صفحةُ الدعوة — بلا نسخِ رمز** (قرارُ المالك ٢٠٢٦-١٠-٠٥)
  ══════════════════════════════════════════════════════════════════════

  كانت تعرض الرمزَ وتطلب من الصديق أن ينسخه بيده، و«تحميل مباشر» يشير
  إلى ملفٍّ غير موجود (٤٠٤)، وزرُّ بلاي `#`، ولا تشبه الموقع.

  # والآن

  الصديقُ يكتب رقمَه ⇒ `POST /api/v1/public/invite/claim {code, phone}`
  ⇒ يُحفظ الحجز ⇒ ينزّل التطبيق ⇒ **وعند تسجيله بالرقم نفسِه يُنسب
  لمن دعاه وحدَه** — ولو نزّل ملفّاً مباشراً لا `referrer` له.

  # والرمزُ من الرابط

  `/signup?ref=CODE` (الرابطُ الذي يولّده الخادم) أو `/i/CODE`.

  # والمحرّكُ بحسب المضيف

  الإنتاجُ `api.rahalgo.com`، **ومضيفٌ يبدأ بـ`staging` ⇒ `staging-api`.**
  والأصلُ `rahalgo.com` في `WEB_ORIGINS` فـCORS يسمح بالنداء.

  # ولا سكربتَ خارجيّ — خطُّ «تجوال» من Google Fonts وحدَه.
  بلباس صفحة الخصوصيّة نفسِه (`deploy/legal/privacy.html`).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap">
<style>
  :root{ --ink:#ffffff; --muted:#ddeff7; --accent:#7ff0d4; --accent-text:#a8f6e2;
         --primary:#6fd3ea; --line:rgb(255 255 255 / .22); --surface:rgb(0 12 20 / .5);
         --danger:#ffaeb8; }
  *{box-sizing:border-box}
  html{background:#06303a}
  body{margin:0;min-height:100vh;color:var(--ink);line-height:1.8;font-weight:500;
    font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    background:linear-gradient(135deg,#0f6b6a 0%,#0b4a6b 45%,#16397a 75%,#3a2b86 100%) fixed}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;
    max-width:520px;margin:0 auto;padding:18px 16px 0}
  .brand{color:var(--ink);text-decoration:none;font-weight:800;font-size:1.25rem}
  .home{color:var(--muted);text-decoration:none;font-size:.9rem;border:1px solid var(--line);
    border-radius:12px;padding:6px 14px}
  main{max-width:520px;margin:0 auto;padding:24px 16px 64px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:20px;
    padding:28px 20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);text-align:center}
  h1{font-size:1.6rem;font-weight:800;margin:0 0 8px}
  p{color:var(--muted);margin:0 0 18px}
  label{display:block;text-align:right;font-weight:700;margin:0 0 6px}
  input{width:100%;font:inherit;font-size:1.15rem;color:var(--ink);text-align:left;direction:ltr;
    background:rgb(255 255 255 / .08);border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;outline:none}
  input:focus{border-color:var(--accent)}
  input::placeholder{color:rgb(221 239 247 / .55)}
  .btn{display:block;width:100%;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:1.05rem;
    background:var(--accent);color:#03202c;text-decoration:none;border-radius:14px;padding:14px;
    margin-top:12px;text-align:center}
  .btn[disabled]{opacity:.6;cursor:wait}
  .alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .msg{border-radius:14px;padding:12px 14px;margin-top:14px;font-weight:700;text-align:right}
  .ok{background:rgb(127 240 212 / .12);border:1px solid var(--accent);color:var(--accent-text)}
  .err{background:rgb(255 174 184 / .08);border:1px solid var(--danger);color:var(--danger)}
  .open{display:inline-block;margin-top:18px;color:var(--accent-text);font-weight:700}
  .note{font-size:.85rem;margin-top:18px;margin-bottom:0}
  [hidden]{display:none !important}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="https://rahalgo.com/">رحّال غو</a>
  <a class="home" href="https://rahalgo.com/">الرئيسية</a>
</header>
<main>
<div class="card">
  <h1>صديقك دعاك إلى رحّال غو 🎁</h1>
  <p>اكتب رقم موبايلك هون، وحمّل التطبيق، وسجّل بنفس الرقم — وهديتك بتوصلك لحالها بدون ما تنسخ أي رمز.</p>

  <form id="claim" novalidate>
    <label for="phone">رقم موبايلك</label>
    <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel"
           placeholder="09xxxxxxxx" required>
    <button class="btn" id="go" type="submit">احجز هديتك وحمّل التطبيق</button>
  </form>

  <div id="msg" class="msg" hidden role="status" aria-live="polite"></div>

  <div id="downloads" hidden>
    <a class="btn" id="play" href="https://play.google.com/store/apps/details?id=com.rahalgo.customer">تحميل من غوغل بلاي</a>
    <a class="btn alt" id="direct" href="https://api.rahalgo.com/api/v1/public/app/customer">تحميل مباشر</a>
  </div>

  <a class="open" id="open" href="/signup">عندك التطبيق؟ افتحه</a>

  <p class="note">سجّل بالتطبيق بنفس الرقم اللي كتبته هون. والحجز بيبقى ٣٠ يوم.</p>
</div>
</main>
<script>
(function () {
  "use strict";
  var host = location.host || "";
  var staging = host.indexOf("staging") === 0;
  var API = staging ? "https://staging-api.rahalgo.com" : "https://api.rahalgo.com";

  // **الرمزُ من الرابط** — `?ref=CODE` أو `/i/CODE`، وحروفٌ وأرقامٌ لا غير.
  function readCode() {
    var q = new URLSearchParams(location.search).get("ref") || "";
    if (!q) {
      var m = location.pathname.match(/^\/i\/([^\/?#]+)/);
      if (m) { q = decodeURIComponent(m[1]); }
    }
    return q.replace(/[^A-Za-z0-9]/g, "").toUpperCase().slice(0, 32);
  }
  var code = readCode();

  var form = document.getElementById("claim");
  var phone = document.getElementById("phone");
  var go = document.getElementById("go");
  var msg = document.getElementById("msg");
  var downloads = document.getElementById("downloads");

  // **روابطُ التنزيل والفتح** — الرمزُ يمشي مع بلاي في `referrer`.
  document.getElementById("direct").href = API + "/api/v1/public/app/customer";
  var play = "https://play.google.com/store/apps/details?id=com.rahalgo.customer";
  if (code) { play += "&referrer=" + encodeURIComponent("ref=" + code); }
  document.getElementById("play").href = play;
  document.getElementById("open").href = location.origin + "/signup" + (code ? "?ref=" + encodeURIComponent(code) : "");

  function say(text, ok) {
    msg.textContent = text;
    msg.className = "msg " + (ok ? "ok" : "err");
    msg.hidden = false;
  }
  function showDownloads() { downloads.hidden = false; }

  // **وبلا رمزٍ لا حجز** — يبقى التنزيلُ وحدَه.
  if (!code) {
    form.hidden = true;
    say("رابط الدعوة ناقص — بس فيك تحمّل التطبيق وتسجّل عادي.", false);
    showDownloads();
    return;
  }

  var errors = {
    invalid_phone: "الرقم مو صحيح — اكتبه هيك: 09xxxxxxxx",
    phone_taken: "هالرقم عنده حساب من قبل — افتح التطبيق وسجّل دخول.",
    bad_invite_code: "رابط الدعوة مو صحيح — اطلب من صديقك يبعتلك ياه من جديد.",
    rate_limited: "محاولات كتير — استنّى شوي وجرّب مرة تانية."
  };

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var raw = (phone.value || "").trim();
    var digits = raw.replace(/[^0-9]/g, "");
    if (digits.length < 9) {
      say(errors.invalid_phone, false);
      phone.focus();
      return;
    }
    go.disabled = true;
    fetch(API + "/api/v1/public/invite/claim", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: code, phone: raw })
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) {
        return { ok: res.ok, body: body };
      });
    }).then(function (r) {
      go.disabled = false;
      if (r.ok) {
        form.hidden = true;
        say("تم حجز هديتك ✓ — حمّل التطبيق هلق وسجّل بنفس الرقم.", true);
        showDownloads();
        return;
      }
      var c = r.body && r.body.error && r.body.error.code;
      say(errors[c] || "صار خطأ — جرّب مرة تانية.", false);
      if (c === "phone_taken") { showDownloads(); }
    }).catch(function () {
      go.disabled = false;
      say("ما قدرنا نوصل — تأكد من الإنترنت وجرّب مرة تانية.", false);
    });
  });
})();
</script>
</body>
</html>
