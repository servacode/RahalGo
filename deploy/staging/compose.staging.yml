# ══════════════════════════════════════════════════════════════════════
#  رحّال غو — بيئةُ التجهيز والتكامل (`P-0`)
# ══════════════════════════════════════════════════════════════════════
#
# # ولا تشارك الإنتاجَ شيئاً (قرارُ المالك `TQ-4`)
#
# **اسمُ المكدّس `rahalgo-staging` لا `rahalgo`** — **والاسمُ في
# `compose` يحكم أسماءَ الحاويات والشبكات والأحجام كلَّها.** فلو شُغّلت
# هذه على مضيف الإنتاج **لَما لمست حاويةً ولا حجماً ولا شبكةً منه.**
#
#     الإنتاج            التجهيز
#     rahalgo_pgdata     rahalgo-staging_pgdata
#     rahalgo_redisdata  rahalgo-staging_redisdata
#     rahalgo_uploads    rahalgo-staging_uploads
#     rahalgo_default    rahalgo-staging_default
#
# **وقاعدةٌ اسمُها `rahalgo_staging`** — **وحارسُ `envguard` يرفض
# `rahalgo` المجرَّد**، فلو أُشير خطأً إلى قاعدة الإنتاج لَسقط الأمر.
#
# # والمنافذُ لا تتصادم
#
# **الإنتاجُ يأخذ ٨٠ و٤٤٣** — **والتجهيزُ يأخذ ٨٠٨٠ و٨٤٤٣.** فيعملان
# على مضيفٍ واحدٍ بلا أن ينتزع أحدُهما منفذَ الآخر.
#
# **والقاعدةُ والذاكرةُ منشورتان على ٥٥٣٤ و٦٥٨٠** — **للتجارب الهدّامة
# من خارج الحاويات** (إسقاطُ `Redis`، تدريبُ الاستعادة). **ويُقيَّدان
# بجدارٍ ناريٍّ إلى الشبكة المحلّيّة** — انظر `provision.sh`.
#
# # ولا سرَّ في هذا الملفّ
#
# **كلُّ قيمةٍ حسّاسةٍ من `.env.staging`** — **وهو غيرُ متتبَّعٍ في git**
# (انظر `.env.staging.example`).

name: rahalgo-staging

services:
  # ── البوّابة ────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: rahalgo-staging-caddy
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
      # **وآثارُ خرائط التجهيز** — نسخةٌ مستقلّةٌ لا حاملُ الإنتاج
      # (`maps-sync.sh`). **وللقراءة وحدَها.**
      - ${STAGING_MAPS_DIR:-/srv/rahalgo-staging/maps}:/srv/maps:ro
      - caddy_data:/data
      - caddy_config:/config
    # ══════════════════════════════════════════════════════════════════
    # **وسجلٌّ بلا سقفٍ يملأ القرص** (دورة ٦٩أ)
    # ══════════════════════════════════════════════════════════════════
    #
    # **وسائقُ `json-file` في دوكر بلا حدٍّ افتراضاً** — والسجلُّ يكبر
    # حتّى يمتلئ القرص. **وكان هذا خطراً قائماً قبل سجلِّ الوصول**،
    # **ويتضاعف بسطرٍ لكلّ طلب.**
    #
    # **فسقفٌ صريح**: ثلاثةُ ملفّاتٍ × عشرةُ ميغا = **ثلاثون ميغا
    # عليا، ولا شيءَ بعدها** — يُطرح الأقدمُ ولا ينمو شيء.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - api
      - web

  # ── المحرّك ─────────────────────────────────────────────────────────
  # ══════════════════════════════════════════════════════════════════
  # **والتجهيزُ يستهلك أثراً مبنيّاً كما يستهلكه الإنتاج** (دورة ٧١)
  # ══════════════════════════════════════════════════════════════════
  #
  # **وهويّةُ البناء تُحقَن وقتَ البناء لا وقتَ التشغيل** (البند ١٠)
  # — **وهي الآن في `deploy/build-artifact.sh`**، **فتُحقَن مرّةً في
  # الأثر ولا تُعاد كتابتُها في كلّ بيئة.**
  #
  # **وهذا شرطُ أن يكون ما يُختبَر هنا هو ما يُرقَّى هناك**: **بيئةٌ
  # تبني لنفسها لا تُثبت عن غيرها.**
  api:
    image: ${RAHALGO_API_IMAGE:?RAHALGO_API_IMAGE مطلوب — ابنِ الأثرَ أوّلاً بـ deploy/build-artifact.sh}
    container_name: rahalgo-staging-api
    restart: unless-stopped
    environment:
      # ══════════════════════════════════════════════════════════════
      # **وهذه أهمُّ سطرٍ في الملفّ**
      # ══════════════════════════════════════════════════════════════
      #
      # **`staging` لا `production`** — **ومنها تُرسَم الرايةُ في
      # اللوحة، ويقبل حارسُ `envguard` الأوامرَ الهدّامة.**
      APP_ENV: staging
      RAHALGO_STAGING: "1"
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://rahalgo:${STAGING_DB_PASSWORD:?}@postgres:5432/rahalgo_staging?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${STAGING_JWT_SECRET:?سرُّ توقيعٍ خاصٌّ بالتجهيز — ولا يُنسَخ من الإنتاج}
      ADMIN_PHONE: ${STAGING_ADMIN_PHONE:?}
      # ══════════════════════════════════════════════════════════════
      # **وكلمةُ الإقلاع لا تُشترَط بعد تمامه** (`TMP`، ٢٠٢٦-٠٩-١٣)
      # ══════════════════════════════════════════════════════════════
      #
      # **وكانت `:?` تُسقط النشرَ إن غابت** — **فسرٌّ خامدٌ صار شرطاً
      # نحويّاً لا يُستطاع حذفُه.**
      #
      # **و`bootstrapPassword` لا تُطبَّق إلّا لمن لا بصمةَ له** —
      # **فبعد أوّل تبديلٍ تصير القيمةُ بلا أثر**، **وبقاؤها نصّاً
      # صريحاً في إعدادٍ مخاطرةٌ بلا فائدة.**
      #
      # **والإنتاجُ لا يشترطها أصلاً** (`${ADMIN_PASSWORD}` بلا `:?`)
      # — **فالتجهيزُ يوافقه.**
      ADMIN_PASSWORD: ${STAGING_ADMIN_PASSWORD:-}
      WEB_ORIGINS: http://localhost:8080,https://staging.rahalgo.com
      UPLOADS_DIR: /app/uploads
      # ══════════════════════════════════════════════════════════════
      # **ومحرّكُ المسارات للتجهيز محرّكُه هو** (٢٠٢٦-٠٩-١٦)
      # ══════════════════════════════════════════════════════════════
      #
      # **وكان الافتراضُ فارغاً** — **فالتجهيزُ يحسب المسافةَ بخطٍّ
      # مستقيمٍ فوق البيوت**، **وكلُّ بندِ ملاحةٍ يُقاس عليه يمرّ
      # كذباً.** (قِيس ٢٠٢٦-٠٩-١٦: «المسارات: لا محرّك».)
      #
      # **والاسمُ `osrm` في شبكة التجهيز لا في شبكة الإنتاج** —
      # **وللشبكتين خدمةٌ بالاسم نفسِه ولا تلتقيان.**
      OSRM_URL: ${STAGING_OSRM_URL:-http://osrm:5000}
      # **والعنونةُ مزوّدٌ عامٌّ بلا حالةٍ ولا مفتاح** — **هو نفسُه
      # الذي في الإنتاج**، **ولا بيانَ منصّةٍ يُرسَل إليه: نقطةٌ
      # تُسأل عن اسمها.**
      GEOCODER_URL: ${STAGING_GEOCODER_URL:-https://nominatim.openstreetmap.org}
      # ══════════════════════════════════════════════════════════════
      # **والمزوّدون الخارجيّون صامتون افتراضاً** (البنود ١٩–٢٢ و٤٤)
      # ══════════════════════════════════════════════════════════════
      #
      # **`OTP_PROVIDER=dev` يطبع الرمزَ في السجلّ ولا يرسل حرفاً** —
      # **ولا رسالةَ تجربةٍ تصل إلى إنسانٍ حقيقيّ.**
      #
      # **و`SMS_URL` فارغةٌ ⇒ الإرسالُ معطَّلٌ بخطأٍ صريحٍ لا بابتلاعٍ
      # صامت** (وهو عقدُ `.env.example` نفسُه).
      #
      # **و`FCM_CREDENTIALS_FILE` غيرُ مضبوطةٍ ⇒ النقلُ صامت** —
      # **ولا إشعارَ يصل إلى جمهور الإنتاج.**
      OTP_PROVIDER: dev
      SMS_URL: ""
      SMS_OTP_URL: ""
      # ══════════════════════════════════════════════════════════════
      # **ودفعُ التجهيز بمشروعِ تجهيزٍ لا بمشروع الإنتاج** (٢٠٢٦-٠٩-١٦)
      # ══════════════════════════════════════════════════════════════
      #
      # **وكان المفتاحُ غائباً فالنقلُ صامت** — **والأثرُ يُنصَّب
      # ويعمل ولا يصل إشعارٌ أبداً**، **فيُقرأ عيباً في المنصّة وهو
      # نقصُ إعداد.** **ولا يُقاس قبولُ `P-8` على دفعٍ لا يعمل.**
      #
      # **والمشروعُ غيرُ مشروع الإنتاج** (`rahalgo-staging`) —
      # **ومشروعٌ واحدٌ للبيئتين يجعل العزلَ محفوظاً بقاعدةِ بياناتٍ
      # لا بالاستحالة**: **رمزُ جهازٍ يصلح لمُرسِلٍ واحدٍ لا لبيئة.**
      #
      # **والآليّةُ آليّةُ الإنتاج نفسُها** — **ملفٌّ لا متغيّرُ بيئة**
      # (سرُّه ألفا حرفٍ فيه أسطرٌ جديدة) — **ولا تكاملَ ثانٍ يُخترَع.**
      #
      # **ولا يدخل المستودعَ أبداً**: يُرفع إلى
      # `/srv/rahalgo-staging/secrets` بصلاحيّة `600` ويُركَّب للقراءة
      # وحدَها — **ومجلَّدُ الإنتاج مجلَّدٌ آخرُ لا يُمَسّ.**
      FCM_CREDENTIALS_FILE: /run/secrets/fcm.json
    volumes:
      - uploads:/app/uploads
      # **للقراءة فقط** (`:ro`) — والمحرّكُ يقرؤه ولا يكتبه.
      - /srv/rahalgo-staging/secrets/fcm.json:/run/secrets/fcm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # ── الويب ───────────────────────────────────────────────────────────
  # **والويبُ أثرٌ يُستهلك لا بناءٌ عند النشر** (دورةُ ٧١و) —
  # **والفرقُ عن الإنتاج في هذه المتغيّرات لا في الصورة.**
  web:
    image: ${RAHALGO_WEB_IMAGE:?RAHALGO_WEB_IMAGE مطلوب — ابنِ الأثرَ أوّلاً بـ deploy/build-artifact.sh}
    container_name: rahalgo-staging-web
    restart: unless-stopped
    environment:
      # ══════════════════════════════════════════════════════════════
      # **وعنوانُ المحرّك كما يراه المتصفّحُ يجب أن يكون `https`**
      # ══════════════════════════════════════════════════════════════
      #
      # (قِيس ٢٠٢٦-٠٩-١٧ — لوحةُ التجهيز كانت لا تعمل في متصفّح.)
      #
      # **وكانت القيمةُ المنشورةُ `http://<ip>:8080`** — **والصفحةُ
      # تُخدَم على `https`.** **والمتصفّحُ يحجب كلَّ نداءٍ عاديٍّ من
      # صفحةٍ مؤمَّنة** (Mixed Content): **فتُفتح اللوحةُ وتُرسم
      # ولا يصل منها نداءٌ واحد** — **ولا خطأَ في الشاشة، والسجلُّ
      # في وحدة تحكّم المتصفّح وحدَها.**
      #
      # **وهو كذلك يكشف منفذَ المحرّك الخام للعموم** — **والبوّابةُ
      # وحدَها تواجه الناس.**
      #
      # **فصار الافتراضُ هو الصحيح** — **ومن نشر بلا ملفّ بيئةٍ
      # حصل على العنوان العامل لا على `localhost`.**
      RAHALGO_API_URL: ${STAGING_API_URL:-https://staging-api.rahalgo.com}
      # ══════════════════════════════════════════════════════════════
      # **وعنوانٌ داخليٌّ للجلبِ من داخل الحاوية** (`DLC`، ٢٠٢٦-٠٩-١٣)
      # ══════════════════════════════════════════════════════════════
      #
      # **والعنوانُ العامُّ فوقُ للمتصفّح** — **وحاويةُ الويب لا تصل
      # إليه**: **قِيس على التجهيز أنّ ارتدادَ عنوان المضيف من داخل
      # الحاوية ينتهي بمهلة.**
      #
      # **وأثرُه كان صامتاً**: **خريطةُ الموقع تُولَّد بلا أقسامٍ** ولا
      # سطرَ خطأٍ في مكان — **وهو سابقٌ لمركز التنزيل وكشفه.**
      #
      # **ولا يصل المتصفّحَ**: **ليس في `/config.js` ولا في
      # `PublicConfig`** — **وعنوانٌ داخليٌّ في صفحةٍ رابطٌ لا يُفتح.**
      RAHALGO_API_INTERNAL_URL: http://api:8080
      RAHALGO_SITE_URL: ${STAGING_SITE_URL:-https://staging-api.rahalgo.com}
      RAHALGO_ENVIRONMENT: staging
      # ══════════════════════════════════════════════════════════════
      # **ونمطُ الخريطة من خرائط التجهيز نفسِه** (قرارُ المالك ٢٠٢٦-٠٩-١٩)
      # ══════════════════════════════════════════════════════════════
      #
      # (تدقيقُ التكافؤ · `ADMIN-STAGING-PRIMARY-PARITY.md` G1.)
      #
      # **وكان فارغاً** — **و`resolveMapSource` لا يرتدّ إلى مصدرٍ عامّ**،
      # **فكانت خرائطُ اللوحة كلُّها معطّلة**: خريطةُ العمليات ومدنُ
      # الإعدادات ومناطقُها ومنتقي موقع المتجر.
      #
      # **ولا يُملأ بـ`maps.rahalgo.com`**: مضيفُ إنتاج (`envguard.ProductionHosts`)
      # **والتجهيزُ لا يسمّيه.** **وحاولتُ ذلك مرّةً فأسقطه الحارسُ — وهو محقّ.**
      #
      # **فللتجهيز خرائطُه** — آثارٌ منسوخةٌ (`maps-sync.sh`) تُخدَم تحت
      # `/maps/` على مضيف التجهيز (`Caddyfile.staging`)، **ونمطٌ يشير إليها.**
      RAHALGO_MAP_STYLE_URL: ${STAGING_MAP_STYLE_URL:-https://staging-api.rahalgo.com/maps/map-resources/1/style.online.json}
    depends_on:
      - api

  # ── القاعدة ─────────────────────────────────────────────────────────
  #
  # **الصورةُ نفسُها التي في الإنتاج** — **وبيئةُ تجهيزٍ بإصدارٍ آخرَ
  # تُثبت شيئاً عن نفسها لا عن الإنتاج.**
  postgres:
    image: postgis/postgis:16-3.4
    container_name: rahalgo-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rahalgo
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:?}
      # **واسمٌ لا يخطئ فيه أحد.**
      POSTGRES_DB: rahalgo_staging
    ports:
      # **منشورةٌ للتجارب الهدّامة** — ويحرسها جدارُ `provision.sh`.
      - "5534:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # **ومجلَّدُ النسخ** — تدريبُ الاستعادة يكتب فيه (البند ٢٩).
      - backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rahalgo -d rahalgo_staging"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── الذاكرة ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rahalgo-staging-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # **ولا بدَّ من إسقاطها في تجربة `R16`** — فتُنشَر.
      - "6580:6379"
    volumes:
      - redisdata:/data

  # ── المسارات ────────────────────────────────────────────────────────
  #
  # **وخريطةُ سوريا مخبوزةٌ في الصورة ولا مجلَّدَ يُركَّب** — **فحاويةٌ
  # ثانيةٌ من الصورة نفسِها لا تكلّف بايتاً واحداً من القرص**، وتأخذ
  # نحوَ ٤٤٠ ميغا من الذاكرة (قِيس على حاوية الإنتاج ٢٠٢٦-٠٩-١٦).
  #
  # **والمشترَكُ صورةٌ ثابتةٌ تُقرأ** — **لا حالةَ تشغيلٍ ولا حجمَ
  # ولا شبكة.** **ولم تُوصَل شبكةُ التجهيز بشبكة الإنتاج** (`TQ-4`):
  # **الوصولُ إلى محرّك الإنتاج عبر الشبكة كان يكسر العزلَ لأجل
  # توفيرِ صورةٍ موجودةٍ أصلاً.**
  #
  # **ولا تُبنى هنا**: **البناءُ ينزّل خريطةَ سوريا ويستخرجها ويقسّمها**
  # — **دقائقُ وغيغاباتٌ على قرصٍ ممتلئ.** **فتُستهلَك الصورةُ المبنيّةُ
  # من `routing/Dockerfile` نفسِه** (النسخةُ مثبَّتةٌ ببصمتها هناك).
  osrm:
    image: ${STAGING_OSRM_IMAGE:-rahalgo-osrm}
    container_name: rahalgo-staging-osrm
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  redisdata:
  uploads:
  backups:
  caddy_data:
  caddy_config:
