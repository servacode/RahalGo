# ══════════════════════════════════════════════════════════════════════
#  رحّال غو — الإنتاج على خادمٍ واحد
# ══════════════════════════════════════════════════════════════════════
#
# **وستُّ حاويات**: بوّابةٌ · محرّكٌ · ويبٌ · قاعدةٌ · ذاكرةٌ · مسارات.
#
# # وما تعلّمناه من Render
#
# **القاعدةُ تُحذف بعد ثلاثين يوما** — وهنا على قرصٍ يبقى.
# **والصورُ تتبخّر مع كلّ نشرة** — وهنا في حجمٍ اسمُه `uploads`.
# **والخدمةُ تنام بعد ربع ساعة** — وهنا لا تنام، **ولذلك سيظهر الطريقُ
# على خريطة السائق**: كان OSRM ينام فينقضي انتظارُ المحرّك (أربعُ ثوانٍ)
# قبل أن يستيقظ (إحدى وعشرون).
#
# # ولا منفذَ مكشوفٌ إلّا اثنان
#
# **٨٠ و٤٤٣ في البوّابة وحدَها** — والقاعدةُ والذاكرةُ وOSRM على شبكةٍ
# داخليّة. **ومنفذُ قاعدةٍ مكشوفٌ للإنترنت يُمسح خلال ساعات.**

name: rahalgo

services:
  # ── البوّابة ────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # **وصفحةُ الدعوة وملفُّ الربط ملفّان ساكنان** — تخدمهما البوّابةُ
      # نفسُها، **فلا يُمسّ تطبيقُ الويب** (قرارُ المالك ٢٠٢٦-٠٨-١٨).
      - ./invite:/srv/invite:ro
      # **وآثارُ الخرائط تُخدَم ساكنةً** — خمسمئةُ ميغا لا تمرّ بتطبيقٍ
      # ولا بمحرّك، **والقراءةُ فقط.**
      - ../maps:/srv/maps:ro
      - ./wellknown:/srv/wellknown:ro
      # **وصفحتا الخصوصيّة وحذف الحساب** — شرطا بلاي، ملفّان ساكنان.
      - ./legal:/srv/legal:ro
      - caddy_data:/data
      - caddy_config:/config
    # ══════════════════════════════════════════════════════════════════
    # **وسجلٌّ بلا سقفٍ يملأ القرص** (دورة ٦٩ب)
    # ══════════════════════════════════════════════════════════════════
    #
    # **وسائقُ `json-file` في دوكر بلا حدٍّ افتراضاً** — وقِيس
    # ٢٠٢٦-٠٩-١١: `LogConfig.Config = map[]`، **أي لا سقفَ أصلاً.**
    # **وكان خطراً قائماً قبل سجلِّ الوصول** (٣٠٨ كيلو في أحدَ عشرَ
    # يوماً)، **ويتضاعف بسطرٍ لكلّ طلب.**
    #
    # **فسقفٌ صريح**: ثلاثةُ ملفّاتٍ × عشرةُ ميغا = **ثلاثون ميغا
    # عليا** — يُطرح الأقدمُ ولا ينمو شيء. **ومدّةُ الحفظ تتبع معدّلَ
    # الطلبات لا الحجم**، وأوّلُ قياسٍ لها في هذه الدورة.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - api
      - web

  # ── المحرّك ─────────────────────────────────────────────────────────
  #
  # ══════════════════════════════════════════════════════════════════
  # **ابنِ مرّةً، ورقِّ الأثرَ عينَه** (دورة ٧١)
  # ══════════════════════════════════════════════════════════════════
  #
  # **وكان هنا `build:`** — **فكلُّ بيئةٍ تبني المحرّكَ بنفسها**،
  # **وأثرٌ اختُبر على التجهيز ليس الأثرَ الذي يعمل في الإنتاج ولو
  # كان الالتزامُ واحداً.** **وفرقٌ في طبقةِ أساسٍ أو في ساعةِ بناءٍ
  # يصنع ثنائيّاً آخر** — **ولا يُثبت الاختبارُ حينئذٍ إلّا عن نفسه.**
  #
  # **فصار النشرُ اختيارَ أثرٍ مبنيٍّ لا بناءَه** (`deploy/promote.sh`).
  #
  # # والفشلُ مغلقٌ لا مفتوح
  #
  # **و`:?` تُسقط الأمرَ إن لم يُحدَّد الأثر** — **ولا بناءَ صامتٌ
  # بديلاً.** **ومن ترك بابَ بناءٍ احتياطيّاً نشر يوماً صورةً لم
  # يختبرها أحد، وهو يظنّه ترقية.**
  #
  # **ولا يُقبَل `latest` هويّةً** — **وسمٌ متحرّكٌ يقول «آخرُ ما
  # بُني على هذا الخادم» لا «ما اعتُمد».**
  api:
    image: ${RAHALGO_API_IMAGE:?RAHALGO_API_IMAGE مطلوب — وسمُ إصدارٍ ثابتٌ أو معرّفُ صورة · ولا بناءَ بديلاً}
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://rahalgo:${DB_PASSWORD}@postgres:5432/rahalgo?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PHONE: ${ADMIN_PHONE}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      WEB_ORIGINS: https://rahalgo.com,https://www.rahalgo.com
      UPLOADS_DIR: /app/uploads
      # **ومحرّكُ المسارات في الشبكة الداخليّة** — لا يناديه أحدٌ سواه.
      OSRM_URL: http://osrm:5000
      GEOCODER_URL: https://nominatim.openstreetmap.org
      # **ورموزُ الدخول بواتساب** — و`dev` تطبعها في السجلّ،
      # **والمحرّكُ يرفض الإقلاع بها في الإنتاج** ومحقٌّ: **سجلٌّ فيه
      # رمزُ دخولٍ مفتاحٌ لكلّ حساب.**
      OTP_PROVIDER: whatsapp
      # ══════════════════════════════════════════════════════════════
      # **ودفعُ الإشعارات — لِما يصل والتطبيقُ مغلق**
      # ══════════════════════════════════════════════════════════════
      #
      # (سؤالُ المالك ٢٠٢٦-٠٨-١٩: «المفروض يصل إشعارٌ لو التطبيق مغلق
      #  صحيح؟» — وكان الجوابُ: لا، الشيفرةُ جاهزةٌ والمفتاحُ ناقص.)
      #
      # **والمفتاحُ ملفٌّ لا متغيّرُ بيئة**: سرُّه ألفا حرفٍ فيه أسطرٌ
      # جديدة، **ومن حشره في متغيّرٍ كسره أوّلُ اقتباسٍ في الطريق.**
      #
      # **ولا يدخل المستودعَ أبدا** — يُرفع إلى `/srv/rahalgo/secrets`
      # بصلاحيّة `600` ويُركَّب للقراءة وحدَها. **ومن يملكه يرسل
      # إشعاراتٍ باسمنا.**
      FCM_CREDENTIALS_FILE: /run/secrets/fcm.json
    volumes:
      - uploads:/app/uploads
      # **للقراءة فقط** (`:ro`) — والمحرّكُ يقرؤه ولا يكتبه.
      - /srv/rahalgo/secrets/fcm.json:/run/secrets/fcm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # ── الويب ───────────────────────────────────────────────────────────
  # ══════════════════════════════════════════════════════════════════
  # **والويبُ يستهلك أثراً كما يستهلكه المحرّك** (دورةُ ٧١و)
  # ══════════════════════════════════════════════════════════════════
  #
  # **وكان يبني هنا بوسائطَ إنتاجٍ تُخبَز في الحزمة** — **فأثرُ
  # التجهيز لا يعرف عنوانَ الإنتاج أصلاً**، وقِيس: صفرُ ذكرٍ لـ
  # `api.rahalgo.com` في حزمة التجهيز مقابل ستٍّ في حزمة الإنتاج.
  # **فصورتان من التزامٍ واحدٍ ليستا أثراً واحداً.**
  #
  # **والبيئةُ صارت تصل وقتَ التشغيل** — `/config.js` يقرأ هذه
  # المتغيّراتِ عند كلّ طلب، **فالصورةُ الواحدةُ تصلح للبيئتين.**
  web:
    image: ${RAHALGO_WEB_IMAGE:?RAHALGO_WEB_IMAGE مطلوب — وسمُ إصدارٍ ثابتٌ أو معرّفُ صورة · ولا بناءَ بديلاً}
    restart: unless-stopped
    environment:
      # **ولا بادئةُ `NEXT_PUBLIC_`** — **تلك تُخبَز وقتَ البناء**،
      # **وهذه تُقرأ وقتَ التشغيل من بيئة الحاوية.**
      RAHALGO_API_URL: https://api.rahalgo.com
      RAHALGO_SITE_URL: https://rahalgo.com
      RAHALGO_ENVIRONMENT: production
      RAHALGO_MAP_STYLE_URL: https://maps.rahalgo.com/map-resources/1/style.online.json
    depends_on:
      - api

  # ── القاعدة ─────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: rahalgo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: rahalgo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rahalgo -d rahalgo"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── الذاكرة ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  # ── المسارات ────────────────────────────────────────────────────────
  #
  # **تحمل خريطةَ سوريا في ذاكرتها** — وبناؤها أوّلَ مرّةٍ يطول.
  osrm:
    build:
      context: ../routing
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
  caddy_data:
  caddy_config:
