name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # الخدمات المالية منطقها في SQL (قيود CHECK ومعاملات ذرّية) — اختبارها
    # بمحاكاة يختبر المحاكاة لا النظام، فيشتغل CI على قاعدة حقيقية بالهجرات نفسها.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rahalgo
          POSTGRES_PASSWORD: rahalgo_test
          POSTGRES_DB: rahalgo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rahalgo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Lint (gofmt + vet)
        run: make lint
      - name: Build
        run: make build
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://rahalgo:rahalgo_test@localhost:5432/rahalgo_test?sslmode=disable
        run: make test

  web:
    name: Web (Next.js workspace)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
