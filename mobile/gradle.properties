# **ذاكرة أوسع للبناء** — البناء الافتراضي يختنق على مشروع فيه Compose.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# **بناء متوازٍ وذاكرة مؤقتة** — أربعة تطبيقات ستُبنى معا يوما.
org.gradle.parallel=true
org.gradle.caching=true

# **مساحات أسماء AndroidX** — لا مكتبات الدعم القديمة.
android.useAndroidX=true

# **وKotlin بنمط رسمي** — لا نمط قديم.
kotlin.code.style=official

# ══════════════════════════════════════════════════════════════════════
# **مواردُ الوحدات تُرى من التطبيق**
# ══════════════════════════════════════════════════════════════════════
#
# (قرارُ المالك ٢٠٢٦-٠٨-١٤: «يجب أن تكون مركزيّةً فلا نبنيها بكلّ
#  تطبيق».)
#
# **وAGP الحديث يفصل `R` كلِّ وحدةٍ عن غيرها** — فنصٌّ يُرفع إلى وحدةٍ
# مشتركةٍ يحتاج أن يُنادى باسمها في كلّ موضع: `com.rahalgo.ui.R.string`.
#
# **وذلك تبديلُ ألفِ نداءٍ لأجل نقل ملفّ** — ولا يكسب شيئاً: الوحداتُ
# أربعٌ لا أربعون، **ولا تصادمَ في أسماء مواردها.**
#
# **والفصلُ يُعاد يومَ تكثر الوحدات** — لا اليوم.
android.nonTransitiveRClass=false

# ══════════════════════════════════════════════════════════════════════
# ولا يُوثَق بمراقب النظام في صحّة الحرّاس (TI، ٢٠٢٦-٠٩-١٥)
# ══════════════════════════════════════════════════════════════════════
#
# وغرادل يبقي صورةَ الملفّات في ذاكرة العفريت ويعتمد على مراقب النظام
# في إبطالها. وحارسُ البنية يقرأ ملفّاتِ وحداتٍ أخرى، فصحّتُه معلّقةٌ
# بصحّة تلك الصورة.
#
# فتُقرأ الملفّاتُ من القرص في كلّ بناء. وليس هذا تعطيلاً للبناء
# التزايديّ: المهمّةُ تبقى محدّثةً إن لم يتبدّل مدخل — وقِيس.
org.gradle.vfs.watch=false
