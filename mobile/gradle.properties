# **ذاكرة أوسع للبناء** — البناء الافتراضي يختنق على مشروع فيه Compose.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# **بناء متوازٍ وذاكرة مؤقتة** — أربعة تطبيقات ستُبنى معا يوما.
org.gradle.parallel=true
org.gradle.caching=true

# **مساحات أسماء AndroidX** — لا مكتبات الدعم القديمة.
android.useAndroidX=true

# **وKotlin بنمط رسمي** — لا نمط قديم.
kotlin.code.style=official
