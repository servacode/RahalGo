# ══════════════════════════════════════════════════════════════════════
#  **كتالوج الإصدارات — مصدر واحد لكل تبعية**
# ══════════════════════════════════════════════════════════════════════
#
# (قاعدة المركزية، `GROUND-RULES.md` §1 و§7.)
#
# **ولماذا ملف واحد لا رقم في كل وحدة**
#
# أربعة تطبيقات وثلاث وحدات مشتركة. **ورقم إصدار يُكتب في كل واحدة يفترق
# يوما**: تطبيق السائق على Compose 1.9 وتطبيق الزبون على 1.8، **فيسقط
# البناء بخطأ لا علاقة له بما كُتب.**
#
# **وهذا بالضبط ما وقع في الويب**: خمسة `package.json` بإصدارات متفرقة.

# **والأرقام تُقرأ من المستودع لا تُخمَّن** — كتبتُ `core-ktx 1.20.0`
# تقديرا فسقط البناء بست دقائق: لا وجود لها. (٢٠٢٦-٠٨-١١.)
#
#   curl -sL https://dl.google.com/dl/android/maven2/<المسار>/maven-metadata.xml

[versions]
# **AGP و Kotlin يتقيدان ببعضهما** — لا يُرفع أحدهما وحده.
agp = "9.3.1"
kotlin = "2.4.10"
# **أدنى إصدار أندرويد ندعمه: 8.0 (API 26).**
#
# **ولماذا 26 لا 24**: الخدمات الأمامية بشكلها الحديث وقنوات الإشعارات
# دخلت في 26. **ودعم ما قبلها يعني مسارين في أخطر شيفرة في المشروع** —
# مسار السائق. وتغطية 26 فما فوق تتجاوز 95% من الأجهزة العاملة.
minSdk = "26"
# **والهدف أحدث ما هو مستقر** — متجر جوجل يشترط هدفا حديثا لقبول التحديث.
targetSdk = "37"
compileSdk = "37"

androidxCore = "1.19.0"
androidxActivity = "1.13.0"
composeBom = "2026.06.01"
lifecycle = "2.11.0"
splashscreen = "1.2.0"
# **أرقام مقروءة من المستودع لا مخمَّنة** — انظر التعليق أعلى الملفّ.
ktor = "3.5.2"
serialization = "1.11.0"
securityCrypto = "1.1.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
# **الحالة تبقى عبر دوران الجهاز** — ومن كتب رقمه ودار جهازه لا يعيده.
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# **موقع مدمج من القمر والشبكة والحسّاسات** — أدقّ وأرحم للبطارية من
# `LocationManager` الخام، وهو ما تستعمله تطبيقات التوصيل كلّها.
play-services-location = { module = "com.google.android.gms:play-services-location", version = "21.4.0" }
# ══════════════════════════════════════════════════════════════════════
# **الخريطة — MapLibre على بلاطات OSM نفسِها التي في الويب**
# ══════════════════════════════════════════════════════════════════════
#
# **ولا مفتاحَ ولا فاتورة** (بخلاف خرائط غوغل)، **ونفس المصدر الذي يرسم
# به الويب** (`web/packages/ui/map.tsx`) — فالمدينة تبدو واحدة في
# الشاشتين.
#
# **وهي التي تدعم المناطق غير المتّصلة** — وعليها يقوم بند «الخريطة تعمل
# بلا إنترنت» في `docs/DRIVER-APP-PLAN.md`.
maplibre = { module = "org.maplibre.gl:android-sdk", version = "13.4.1" }
# ══════════════════════════════════════════════════════════════════════
# **الإشعار — وهو ما يجعل التطبيق يعمل والسائق لا ينظر إليه**
# ══════════════════════════════════════════════════════════════════════
#
# **وبلاه يفتح السائق تطبيقه كلّ دقيقتين ليرى إن نزل طلب** — والطلب
# يفوت لمن فتحه أوّلا. **والبثّ الحيّ لا يكفي**: يعمل والتطبيق مفتوح
# وحدَه، **وأكثر وقت السائق شاشتُه مطفأة.**
#
# **والحزمة الجامعة (BoM) تختار النسخ المتوافقة** — فلا يُكتب لكلّ
# مكتبةٍ رقمُها ويفترقان.
firebase-bom = { module = "com.google.firebase:firebase-bom", version = "34.17.0" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
# **جسرٌ بين مهامّ غوغل ومعلّقات كوتلن** — `token.await()` بدل ردّ نداء.
coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version = "1.11.0" }

# **قائمة مواد Compose** — تضبط إصدارات مكتبات Compose كلها من رقم واحد،
# **فلا تتصادم نسخة `ui` مع نسخة `material3`.**
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }

# **شاشةُ النظام عند الإقلاع** — الطريقةُ الرسميّةُ منذ أندرويد ١٢،
# وهذه المكتبةُ تُرجعها إلى ٨ بالسلوك نفسِه. **وبلاها يُرسم إقلاعُنا
# على أجهزةٍ ويُترك للنظام على أخرى.**
androidx-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }

# ══════════════════════════════════════════════════════════════════════
#  **الشبكة والتحويل — قلب `shared`**
# ══════════════════════════════════════════════════════════════════════
#
# **Ktor لا OkHttp مباشرة**: `shared` لا تعرف أندرويد (القاعدة ٧.٢)،
# **وOkHttp حزمة أندرويد/JVM**. وKtor واجهة واحدة فوق محرّكات متعدّدة —
# على أندرويد OkHttp، وعلى آيفون Darwin، **والشيفرة فوقها واحدة.**
#
# **و`kotlinx.serialization` رسميّة من JetBrains** — تولّد المحوّلات في
# زمن الترجمة لا بالانعكاس، **فلا تكسر مع التشويش في بناء الإصدار.**
ktor-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
# **البثّ الحيّ** — الشاشة تتحدّث بنفسها والتطبيق مفتوح.
ktor-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# **حفظ التوكن مشفّرا بمفتاح في عتاد الجهاز** — انظر `AndroidSession`.
# **وتوكن التجديد مفتاح الحساب**: من ملكه دخل باسم صاحبه حتى يُبطَل.
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }

[plugins]
google-services = { id = "com.google.gms.google-services", version = "4.5.0" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# **ولا إضافة `kotlin-android`** — AGP 9 فيها دعم Kotlin مدمج،
# وتطبيقها يُسقط البناء برسالة صريحة.
# **مُصرّف Compose صار جزءا من Kotlin منذ 2.0** — لا إصدار مستقلا له.
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# **مولّد محوّلات JSON** — يعمل في زمن الترجمة.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
