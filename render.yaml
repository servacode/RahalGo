# ══════════════════════════════════════════════════════════════════════
#  مخطّطةُ الرفع على Render — للتجربة
# ══════════════════════════════════════════════════════════════════════
#
# (قرارُ المالك ٢٠٢٦-٠٨-١٠: «أوّلُ شيءٍ نجهّز الموقع نرفعه على Render
#  للتجربة، ثمّ لاحقاً بالوقت المناسب استضافةٌ حقيقيّةٌ ودومين».)
#
# **وأربعةُ أشياءَ لا ثلاثة**: قاعدةٌ وذاكرةٌ ومحرّكٌ وويب. **والمحرّكُ
# والويبُ خدمتان منفصلتان** — لكلٍّ عنوانُه، **فيلزم أن يعرف كلٌّ عنوانَ
# الآخر**: الويبُ ينادي المحرّك، والمحرّكُ يسمح لنطاق الويب (CORS).
#
# # وما يجب أن تعرفه قبل أن ترفع
#
# **قاعدةُ Render المجّانيّة تُحذف بعد شهر** — فهذه تجربةٌ لا إنتاج.
# **والخدمةُ المجّانيّةُ تنام بعد خمسَ عشرةَ دقيقةً من السكون**، وأوّلُ نداءٍ
# بعدها ينتظر نحوَ نصف دقيقةٍ حتّى تستيقظ.
#
# **والوسائطُ تتبخّر**: لا قرصَ دائمَ في المجّانيّ، **فكلُّ صورةٍ تُرفع تزول
# مع أوّل نشرةٍ أو إعادةِ تشغيل** — والصفوفُ تبقى في القاعدة تشير إلى ملفّاتٍ
# ذهبت. (انظر `docs/DEPLOY.md`.)
#
# # والأسرارُ لا تُكتب هنا
#
# **`sync: false` تعني «اسألني عند أوّل نشر»** — فلا يُكتب سرٌّ في ملفٍّ
# يُرفع إلى المستودع.

databases:
  - name: rahalgo-db
    databaseName: rahalgo
    user: rahalgo
    plan: free
    # **وPostGIS يُنشئه الترحيلُ الأوّل بنفسه** (`0001_extensions.sql`) —
    # **ولا يحتاج إذناً**: مستخدمُ Render مالكُ قاعدته.
    postgresMajorVersion: "16"

services:
  # ── الذاكرة — طوابيرُ الرموز وحدودُ المحاولات ──────────────────────
  - type: keyvalue
    name: rahalgo-redis
    plan: free
    ipAllowList: []   # **داخليٌّ فقط** — لا يُفتح للشبكة.
    maxmemoryPolicy: noeviction

  # ── المحرّك ──────────────────────────────────────────────────────
  - type: web
    name: rahalgo-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    # ══════════════════════════════════════════════════════════════════
    # **والوسائطُ تحتاج قرصاً — وهو مدفوع**
    # ══════════════════════════════════════════════════════════════════
    #
    # **بلا قرصٍ دائمٍ كلُّ صورةٍ تُرفع تزول** مع أوّل نشرةٍ أو إعادةِ تشغيل،
    # **والصفوفُ تبقى في القاعدة تشير إلى ملفّاتٍ ذهبت** — فتردّ الصورُ ٤٠٤
    # بلا خطأٍ في سجلّ.
    #
    # **وهو مقبولٌ في تجربةٍ يرفع فيها المالكُ صورةً ليرى الشكل**، غيرُ
    # مقبولٍ في إنتاج. **فيُفتح السطران عند أوّل استضافةٍ حقيقيّة.**
    # disk:
    #   name: rahalgo-uploads
    #   mountPath: /app/uploads
    #   sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: HTTP_ADDR
        # **ومنفذُ Render من البيئة** — والثابتُ يجعل الفحصَ يفشل والخدمةَ
        # تُقرأ ميّتةً وهي تعمل.
        value: ":10000"
      - key: DATABASE_URL
        fromDatabase:
          name: rahalgo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: rahalgo-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # **ومزوّدُ الرمز لا يكون `dev` في الإنتاج** — يرفضه المحرّكُ عند
      # الإقلاع. **ويلزم اقترانُ البوت من لوحة النسخة المرفوعة.**
      - key: OTP_PROVIDER
        value: whatsapp
      # **ونطاقُ الويب يُملأ بعد أوّل نشرةٍ للويب** — عنوانُه لا يُعرف قبلها.
      # **مفتاحُ الدفع — يُلصق محتوى ملفّ حساب الخدمة كاملاً.**
      #
      # **ولا قرصَ دائماً على الخطّة المجّانيّة** — فيُوضع في متغيّرٍ لا
      # في ملفّ. **وغيابُه لا يُسقط المحرّك**: يُسجَّل خطأً وتعمل المنصّةُ
      # بالبثّ الحيّ وحدَه.
      - key: FCM_CREDENTIALS_JSON
        sync: false
      - key: WEB_ORIGINS
        sync: false
      # ══════════════════════════════════════════════════════════════════
      # **وحسابُ المالك يُصنع عند الإقلاع — وإلّا فالنسخةُ مقفلةٌ عليه**
      # ══════════════════════════════════════════════════════════════════
      #
      # (كشفه المالك ٢٠٢٦-٠٨-١٠: «كيف رح يجي رمز وأساساً المنصّة لسّا مو
      #  مربوطة بواتساب؟ المفروض يكون في حساب أدمن جاهز بكلمة سر».)
      #
      # **قاعدةٌ جديدةٌ فارغة**: لا حسابَ فيها. والحسابُ بلا كلمةِ مرورٍ
      # يدخل برمز واتساب، **والبوتُ لا يُقترن إلّا من لوحةٍ لا تُفتح إلّا
      # بدخول** — حلقةٌ مفرغةٌ تقفل النسخةَ على صاحبها.
      #
      # **فالرقمُ يصنع الحساب، والكلمةُ تفتحه أوّلَ مرّة.**
      # **وتُكتب مؤقّتةً** — تُضبط لمن لا كلمةَ له فقط، **فلا تدهس نشرةٌ
      # لاحقةٌ الكلمةَ التي اختارها.** وبعد تبديلها احذف المتغيّر.
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # ── الويب ────────────────────────────────────────────────────────
  - type: web
    name: rahalgo-web
    runtime: node
    plan: free
    # **والبناءُ من جذر مساحة العمل** — الحزمُ المشتركةُ (`packages/*`)
    # تُبنى معه، **وبناءُ التطبيق وحدَه يفشل على `workspace:*`.**
    rootDir: web
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @rahalgo/web build
    startCommand: pnpm --filter @rahalgo/web start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # ══════════════════════════════════════════════════════════════
      # **وعنوانُ المحرّك اسمُ مضيفٍ لا رابطٌ كامل**
      # ══════════════════════════════════════════════════════════════
      #
      # **`property: url` غيرُ موجودةٍ في مواصفة Render** — المسموحُ
      # `host` و`port` و`hostport` و`connectionString`. **وكتبتُها أوّلَ
      # مرّةٍ ظنّاً، فكانت المخطّطةُ تُرفض عند القراءة.**
      #
      # **فيُؤخذ المضيفُ ويُكمَّل `https://` في `next.config`** — موضعٌ
      # واحدٌ يُطبّع القيمةَ قبل أن تُخبَز في الحزمة.
      #
      # **وتُحقن وقتَ البناء لا وقتَ التشغيل**: `NEXT_PUBLIC_*` تُخبَز في
      # حزمة المتصفّح، **فمن بدّلها بعد البناء لم يبدّل شيئاً** — يلزمه
      # نشرٌ جديد.
      # ══════════════════════════════════════════════════════════════
      # **والعنوانُ يُكتب صريحاً — ولا يُشتقّ من الخدمة**
      # ══════════════════════════════════════════════════════════════
      #
      # **جُرّب الاشتقاقُ مرّتين فسقط مرّتين** (٢٠٢٦-٠٨-١٠/١١):
      #
      #   - `property: url` — **لا وجودَ لها في المواصفة**، فحُلّت فراغاً.
      #   - `property: host` — **تعطي الاسمَ الداخليّ** (`rahalgo-api`)
      #     لا العامّ. وهو اسمٌ يُنادى به بين خدمات الاستضافة، **ولا
      #     يعرفه متصفّحُ الزبون** — فخُبز `https://rahalgo-api` في الحزمة
      #     وسقط كلُّ نداء.
      #
      # **ولا خاصّيّةَ في المواصفة تعطي العنوانَ العامّ** — فيُكتب.
      # **واسمُ الخدمة يحدّده**: إن أعطاها Render اسماً آخر لتعارضٍ،
      # صحّح هذا السطر.
      #
      # **وحارسٌ في `next.config` يرفض ما لا يصلح عنواناً عامّاً** — فلا
      # يتكرّر صامتاً.
      - key: NEXT_PUBLIC_API_URL
        value: https://rahalgo-api.onrender.com
      # **وعنوانُ الموقع لا يُطلب من أحد** — Render يضع `RENDER_EXTERNAL_URL`
      # في الخدمة نفسِها، **ويقرؤه `next.config` عند البناء.**
