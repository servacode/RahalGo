# بيئة التطوير المحلية — RahalGo
# التشغيل: docker compose up -d
#
# **المنافذُ المنشورة ٥٤٣٤ و٦٣٨٠ — لا ٥٤٣٢ و٦٣٧٩.**
#
# على جهاز التطوير مشروعٌ آخر يشغل المنفذين القياسيّين. ونشرُهما هنا يعني
# أحدَ أمرين: إمّا يفشل الإقلاع لأن المنفذ مأخوذ، **وإمّا ينجح فيسرق منفذ
# مشروعٍ آخر** — وحينها يتصل خادمُ ذاك المشروع بقاعدتنا أو نتصل نحن بقاعدته.
#
# وقد وقع هذا فعلاً: خادمُنا حاول ٥٤٣٢ ونجا **بفشل استيثاقٍ لا بتصميم**.
# **ونجاةٌ بالصدفة ليست حمايةً**، فصار الافتراضُ هنا وفي `config.go` واحداً.
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: rahalgo-postgres
    environment:
      POSTGRES_USER: rahalgo
      POSTGRES_PASSWORD: rahalgo_dev
      POSTGRES_DB: rahalgo
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rahalgo -d rahalgo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rahalgo-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
